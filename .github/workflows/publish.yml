name: Publish
# Publish to npm on version tags: `git tag v0.1.1 && git push origin v0.1.1`.
# Every push would fail (registry rejects re-publishing the same version),
# so tags — not branches — are the release switch.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance attestation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG — refusing to publish"
            exit 1
          fi

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # Full tests already gate every push/PR via ci.yml; publish re-runs
      # only the fast static gates to keep releases snappy.

      # Idempotency: re-pushing a tag (or a manual publish beating the
      # workflow to it) must skip, not fail — the registry rejects
      # overwrites and a red tag looks like a broken release.
      - name: Check if version already published
        id: published
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VER already on the registry — skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --provenance --access public
        if: steps.published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
