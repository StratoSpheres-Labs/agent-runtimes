name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates run ONCE (ubuntu/node24): build, lint, typecheck, format,
  # audit are platform-independent — running them 6x (full matrix) only
  # burns fleet time and multiplies preemption reds. Platform coverage
  # lives in the test matrix below (install + suite per OS/arch).
  static:
    name: static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate order matters: build → lint → typecheck → format (AGENTS.md §3).
      # format:check was previously enforced only locally — a badly
      # formatted push stayed green until human review caught it.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

      # Locks in the clean audit: moderate+ advisories fail the build.
      # Low is informational only (dev-server-only shapes like the esbuild
      # one we overrode) — Dependabot still reports them, CI doesn't burn on them.
      - run: pnpm audit --audit-level moderate

  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tests run from src (vitest transform, no dist needed) — build lives
      # in the static job above. The suite runs twice at most: fleet preemption (notably
      # macos-latest during the Tahoe 26 rollout) kills the test step
      # with zero failing assertions ("The runner has received a
      # shutdown signal", 2026-09-27/28, repeated). A genuine failure
      # fails both attempts and stays red — the retry only absorbs
      # infra kills, it never masks an assertion failure.
      - name: Run tests (one retry for transient runner death)
        shell: bash
        run: |
          attempt=1
          max_attempts=2
          until [ $attempt -gt $max_attempts ]; do
            echo "--- test attempt $attempt/$max_attempts ---"
            if pnpm test; then
              echo "tests passed on attempt $attempt"
              exit 0
            fi
            attempt=$((attempt + 1))
          done
          echo "tests failed on all $max_attempts attempts"
          exit 1

      # Integration tests skip gracefully when no Agent CLI is installed.
      # Real-CLI leg: install opencode on ubuntu+node24 to exercise the
      # live-CLI path at least once (docs/cross-platform.md §8).
      - name: Install opencode (real-CLI leg)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm install -g opencode-ai@latest

      - name: Verify opencode real-CLI (after install)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: opencode --version && pnpm test tests/integration/opencode.test.ts tests/integration/opencode-acp.test.ts
