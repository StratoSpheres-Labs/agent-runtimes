name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate order matters: build → lint → typecheck → test (AGENTS.md §3)
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck

      # The suite runs twice at most: fleet preemption (notably
      # macos-latest during the Tahoe 26 rollout) kills the test step
      # with zero failing assertions ("The runner has received a
      # shutdown signal", 2026-09-27/28, repeated). A genuine failure
      # fails both attempts and stays red — the retry only absorbs
      # infra kills, it never masks an assertion failure.
      - name: Run tests (one retry for transient runner death)
        shell: bash
        run: |
          attempt=1
          max_attempts=2
          until [ $attempt -gt $max_attempts ]; do
            echo "--- test attempt $attempt/$max_attempts ---"
            if pnpm test; then
              echo "tests passed on attempt $attempt"
              exit 0
            fi
            attempt=$((attempt + 1))
          done
          echo "tests failed on all $max_attempts attempts"
          exit 1

      # Integration tests skip gracefully when no Agent CLI is installed.
      # Real-CLI leg: install opencode on ubuntu+node24 to exercise the
      # live-CLI path at least once (docs/cross-platform.md §8).
      - name: Install opencode (real-CLI leg)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm install -g opencode-ai@latest

      - name: Verify opencode real-CLI (after install)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: opencode --version && pnpm test --run tests/integration/opencode.test.ts tests/integration/opencode-acp.test.ts
