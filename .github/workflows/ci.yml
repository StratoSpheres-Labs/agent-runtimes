name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS is pinned to a stable image: macos-latest (Tahoe 26)
        # repeatedly SIGTERM'd the test step with zero failing
        # assertions (2026-09-27, three consecutive runs). Re-pin to
        # latest only after the fleet image stabilizes.
        os: [windows-latest, macos-15, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate order matters: build → lint → typecheck → test (AGENTS.md §3)
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Integration tests skip gracefully when no Agent CLI is installed.
      # Real-CLI leg: install opencode on ubuntu+node24 to exercise the
      # live-CLI path at least once (docs/cross-platform.md §8).
      - name: Install opencode (real-CLI leg)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm install -g opencode-ai@latest

      - name: Verify opencode real-CLI (after install)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: opencode --version && pnpm test --run tests/integration/opencode.test.ts tests/integration/opencode-acp.test.ts
